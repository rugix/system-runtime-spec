[workspace]
resolver = "2"
members = ["crates/apps/system-runtime", "crates/libs/system-runtime"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Silitics GmbH <info@silitics.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rugix/system-runtime-spec"

[workspace.dependencies]
anyver = "0.3.0"
clap = { version = "4.6.7", features = ["derive"] }
reportify = { version = "0.2.2", default-features = false, features = ["color"] }
sidex = { version = "0.5.0", features = ["serde-1"] }
system-runtime-spec = { path = "crates/libs/system-runtime" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rustix = { version = "1", features = ["fs", "time"] }
serde = "1"
tempfile = "3"

[profile.release]
strip = true
lto = true
