[tools]
"github:silitics/sidex" = "0.6.0"
rust = { version = "1.99.0", profile = "minimal", components = ["rustfmt", "clippy"] }
node = "24"
python = "3.12"
uv = "0.12.15"

[tasks.generate]
run = "python scripts/generate.py"

[tasks."check:generated"]
run = [
    "sidex fmt --check",
    "python scripts/generate.py --check",
    "python scripts/check_release.py",
    "python scripts/check_spec.py",
    "python -m unittest discover -s scripts -p 'test_*.py'",
]

[tasks."check:rust"]
run = [
    "cargo fmt --all --check",
    "cargo clippy --workspace --all-targets --locked -- -D warnings",
    "cargo test --workspace --locked",
    "cargo build --workspace --release --locked",
    'RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked',
]

[tasks."check:python"]
dir = "python"
run = [
    "uv sync --locked",
    "uv run ruff format --check .",
    "uv run ruff check .",
    "uv run mypy system_runtime_spec",
    "uv run pytest",
    "uv build",
]

[tasks."check:typescript"]
dir = "typescript"
run = ["npm ci", "npm run check", "npm test", "npm pack"]

[tasks.check]
depends = ["check:generated", "check:rust", "check:python", "check:typescript"]

[tasks."build:cli"]
description = "Build the command-line tool for a Linux target into dist/"
usage = 'arg "<target>" help="Rust target, such as aarch64-unknown-linux-musl"'
run = """
set -euo pipefail
version="${SYSTEM_RUNTIME_VERSION:-dev}"
rustup target add "$usage_target"
# The tool is pure Rust, so Rust's own linker links it for every musl target.
export "CARGO_TARGET_$(echo "$usage_target" | tr a-z- A-Z_)_LINKER=rust-lld"
SYSTEM_RUNTIME_VERSION="$version" cargo build --locked --release -p system-runtime --target "$usage_target"
name="system-runtime-$version-$usage_target"
rm -rf "dist/$name" "dist/$name.tar.gz"
mkdir -p "dist/$name"
cp "target/$usage_target/release/system-runtime" LICENSE-APACHE LICENSE-MIT "dist/$name/"
tar -czf "dist/$name.tar.gz" -C dist "$name"
rm -r "dist/$name"
"""

[tasks.lock]
description = "Refresh the lockfiles after changing package versions"
run = [
    "cargo update --workspace",
    "uv lock --project python",
    "npm install --package-lock-only --ignore-scripts --prefix typescript",
]

[tasks."release:preview"]
description = "Show what a release of the current commit publishes and its notes"
usage = 'arg "[tag]" help="Release tag, by default the current UTC date"'
run = "python scripts/release.py preview ${usage_tag:-}"

[tasks."release:tag"]
description = "Tag the latest commit of main as a release and push the tag"
usage = 'arg "[tag]" help="Release tag, by default the current UTC date"'
run = "python scripts/release.py tag ${usage_tag:-}"
