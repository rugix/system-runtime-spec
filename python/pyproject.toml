[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "system-runtime-spec"
version = "0.2.0"
description = "System component compatibility, health evaluation, and filesystem discovery."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
readme = "README.md"
authors = [{name = "Silitics GmbH", email = "info@silitics.com"}]

[project.urls]
Repository = "https://github.com/rugix/system-runtime-spec"
Documentation = "https://github.com/rugix/system-runtime-spec#readme"
Issues = "https://github.com/rugix/system-runtime-spec/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[tool.hatch.build.targets.wheel]
packages = ["system_runtime_spec"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["system_runtime_spec/models"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
