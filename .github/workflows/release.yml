name: Release

on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"]
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check_release.py"
      - "scripts/test_check_release.py"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (requires selecting a release tag)
        type: boolean
        default: false
      registry:
        description: Registry to publish to (select one to recover a partial release)
        type: choice
        options: [all, crates-io, pypi, npm]
        default: all

permissions:
  contents: read

# Unlike the implicit default, an explicit Bash shell sets `pipefail`.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name == 'push' || inputs.publish || false }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      crates-io: ${{ steps.release.outputs.crates-io }}
      pypi: ${{ steps.release.outputs.pypi }}
      npm: ${{ steps.release.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Release
        id: release
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish || false }}
        run: |
          if [ "$PUBLISH" = true ]; then
            test "$GITHUB_REF_TYPE" = tag
            python3 scripts/check_release.py --tag "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
          else
            python3 scripts/check_release.py
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  crates-io:
    needs: [prepare, checks]
    if: >-
      needs.prepare.outputs.crates-io == 'true' &&
      github.repository == 'rugix/system-runtime-spec' &&
      (github.event_name == 'push' || inputs.registry == 'all' || inputs.registry == 'crates-io')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install rust
      - name: Authenticate with Trusted Publishing
        if: env.CARGO_REGISTRY_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish Crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p system-runtime-spec

  pypi:
    needs: [prepare, checks]
    if: >-
      needs.prepare.outputs.pypi == 'true' &&
      github.repository == 'rugix/system-runtime-spec' &&
      (github.event_name == 'push' || inputs.registry == 'all' || inputs.registry == 'pypi')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/system-runtime-spec/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  npm:
    needs: [prepare, checks]
    if: >-
      needs.prepare.outputs.npm == 'true' &&
      github.repository == 'rugix/system-runtime-spec' &&
      (github.event_name == 'push' || inputs.registry == 'all' || inputs.registry == 'npm')
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/system-runtime-spec
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with Trusted Publishing Support
        run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-distribution
          path: dist
      - name: Publish npm Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./dist/system-runtime-spec-*.tgz --access public

  github-release:
    needs: [prepare, checks, crates-io, pypi, npm]
    if: >-
      always() &&
      needs.prepare.outputs.publish == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.repository == 'rugix/system-runtime-spec'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            previous=$(python3 scripts/check_release.py --tag "$TAG" --notes notes.md | sed -n 's/^previous=//p')
            args=(--verify-tag --title "$TAG" --notes "$(cat notes.md)" --generate-notes)
            if [ -n "$previous" ]; then
              args+=(--notes-start-tag "$previous")
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          (cd dist && sha256sum system-runtime-*.tar.gz > SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber
