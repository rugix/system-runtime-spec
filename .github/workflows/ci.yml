name: CI

on:
  # Pull requests cover other branches, so that their pushes do not run twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generated:
    name: Schemas and Generated Sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install rust python github:silitics/sidex
      - name: Check Schemas and Generated Sources
        run: mise run --skip-tools check:generated
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install rust
      - name: Check, Test, and Build
        run: mise run --skip-tools check:rust
      - name: Verify Crate Package
        if: inputs.release
        run: cargo publish --dry-run --locked -p system-runtime-spec

  cli:
    name: Command-Line Tool (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install rust
      - name: Build
        env:
          SYSTEM_RUNTIME_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: mise run --skip-tools build:cli ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release
        with:
          name: cli-${{ matrix.target }}
          path: dist/system-runtime-*.tar.gz
          if-no-files-found: error

  python:
    name: Python
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install python uv
      - name: Check, Test, and Build
        run: mise run --skip-tools check:python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release
        with:
          name: python-distributions
          path: python/dist/*
          if-no-files-found: error

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install node
      - name: Check, Test, and Build
        run: mise run --skip-tools check:typescript
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release
        with:
          name: npm-distribution
          path: typescript/system-runtime-spec-*.tgz
          if-no-files-found: error
